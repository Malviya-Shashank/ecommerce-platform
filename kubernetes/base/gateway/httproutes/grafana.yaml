################################################################################
# HTTPRoute for Grafana - Accessed via Gateway API (NOT LoadBalancer)
# This saves ~$18/month by not creating a separate NLB
################################################################################

apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: grafana
  namespace: monitoring
spec:
  parentRefs:
    - name: ecommerce-gateway
      namespace: ecommerce
  hostnames:
    - "grafana.yourdomain.com"
  rules:
    - backendRefs:
        - name: grafana
          port: 3000
