################################################################################
# HTTPRoute for ArgoCD - Accessed via Gateway API (NOT LoadBalancer)
# This saves ~$18/month by not creating a separate NLB
#
# Dev: hostname patched by scripts/setup-sslip-domain.sh
#      e.g., ecommerce-argocd-52-66-123-45.sslip.io
################################################################################

apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: argocd
  namespace: argocd
spec:
  parentRefs:
    - name: ecommerce-gateway
      namespace: ecommerce
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /argocd
      backendRefs:
        - name: argocd-server
          port: 80
