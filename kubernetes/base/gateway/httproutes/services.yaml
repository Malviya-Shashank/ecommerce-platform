################################################################################
# HTTPRoutes for Microservices
#
# Hostname: Uses sslip.io wildcard pattern for dev (free, no Route53 needed)
# After deployment, run: scripts/setup-sslip-domain.sh
# to patch these routes with the actual ALB IP-based sslip.io domain.
#
# Format: ecommerce-api-<ALB-IP-with-dashes>.sslip.io
# Example: ecommerce-api-52-66-123-45.sslip.io
################################################################################

# User Service
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: user-service
  namespace: ecommerce
spec:
  parentRefs:
    - name: ecommerce-gateway
      namespace: ecommerce
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /api/v1/users
      backendRefs:
        - name: user-service
          port: 8000
---
