################################################################################
# HTTPRoutes for Microservices
################################################################################

# User Service
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: user-service
  namespace: ecommerce
spec:
  parentRefs:
    - name: ecommerce-gateway
      namespace: ecommerce
  hostnames:
    - "api.yourdomain.com"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /api/v1/users
      backendRefs:
        - name: user-service
          port: 8000
---
