version: '3.8'

services:
  # Shared PostgreSQL database service pre-seeded with sample data
  postgres:
    image: postgres:16-alpine
    container_name: ecommerce-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      timeout: 3s
      retries: 5
    networks:
      - ecommerce-network

  # User Service (HTTP: 8001, gRPC client → notification-service:50051)
  user-service:
    build:
      context: ./services/user-service
      dockerfile: Dockerfile
    container_name: user-service
    environment:
      - DATABASE_URL=postgresql://postgres:password@postgres:5432/user_service
      - NOTIFICATION_SERVICE_GRPC=notification-service:50051
    ports:
      - "8001:8000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - ecommerce-network

  # Product Service (HTTP: 8002, gRPC server: 50052 → mapped from 50051)
  product-service:
    build:
      context: ./services/product-service
      dockerfile: Dockerfile
    container_name: product-service
    environment:
      - DATABASE_URL=postgresql://postgres:password@postgres:5432/product_service
    ports:
      - "8002:8000"
      - "50052:50051"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - ecommerce-network

  # Order Service (HTTP: 8003, gRPC client → product-service + notification-service)
  order-service:
    build:
      context: ./services/order-service
      dockerfile: Dockerfile
    container_name: order-service
    environment:
      - DATABASE_URL=postgresql://postgres:password@postgres:5432/order_service
      - PRODUCT_SERVICE_GRPC=product-service:50051
      - NOTIFICATION_SERVICE_GRPC=notification-service:50051
    ports:
      - "8003:8000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - ecommerce-network

  # Payment Service (HTTP: 8004, gRPC client → notification-service)
  payment-service:
    build:
      context: ./services/payment-service
      dockerfile: Dockerfile
    container_name: payment-service
    environment:
      - DATABASE_URL=postgresql://postgres:password@postgres:5432/payment_service
      - NOTIFICATION_SERVICE_GRPC=notification-service:50051
    ports:
      - "8004:8000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - ecommerce-network

  # Notification Service (HTTP: 8005, gRPC server: 50051)
  notification-service:
    build:
      context: ./services/notification-service
      dockerfile: Dockerfile
    container_name: notification-service
    environment:
      - DATABASE_URL=postgresql://postgres:password@postgres:5432/notification_service
    ports:
      - "8005:8000"
      - "50051:50051"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - ecommerce-network

  # Frontend Static Dashboard UI (Port 8081)
  frontend:
    image: nginx:alpine
    container_name: ecommerce-frontend
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
    ports:
      - "8081:80"
    networks:
      - ecommerce-network

volumes:
  postgres_data:

networks:
  ecommerce-network:
    driver: bridge
