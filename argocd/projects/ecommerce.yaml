################################################################################
# ArgoCD AppProject - E-Commerce Services
################################################################################

apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: ecommerce
  namespace: argocd
spec:
  description: E-Commerce Platform Services
  sourceRepos:
    - "https://github.com/Malviya-Shashank/ecommerce-platform.git"
  destinations:
    - namespace: ecommerce
      server: https://kubernetes.default.svc
    - namespace: argocd
      server: https://kubernetes.default.svc
  clusterResourceWhitelist:
    - group: ""
      kind: Namespace
  namespaceResourceWhitelist:
    - group: "*"
      kind: "*"
  orphanedResources:
    warn: true
