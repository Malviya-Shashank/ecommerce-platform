################################################################################
# Terraform CI/CD Workflow — Full Push-to-Deploy Pipeline
# PRs:  fmt → validate → security scan → plan (comment on PR)
# Push: fmt → validate → security scan → apply → bootstrap ArgoCD
################################################################################

name: CI/CD - Terraform & Infrastructure

on:
  push:
    branches: [main]
    paths:
      - "terraform/**"
      - "argocd/**"
      - "kubernetes/**"
      - ".github/workflows/ci-terraform.yaml"
  pull_request:
    branches: [main]
    paths:
      - "terraform/**"

concurrency:
  group: terraform-${{ github.ref }}
  cancel-in-progress: true

permissions:
  id-token: write    # OIDC for AWS
  contents: read
  pull-requests: write
  security-events: write

env:
  TF_VERSION: "1.10.0"
  AWS_REGION: "ap-south-1"
  ENVIRONMENT: "dev"
  CLUSTER_NAME: "ecommerce-dev-eks"

jobs:
  ############################################################################
  # Stage 1: Format & Validate
  ############################################################################
  format-validate:
    name: "📐 Format & Validate"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Format Check
        run: terraform fmt -check -recursive terraform/

      - name: Terraform Validate (Dev)
        run: |
          cd terraform/environments/dev
          terraform init -backend=false
          terraform validate

      - name: Terraform Validate (Staging)
        run: |
          cd terraform/environments/staging
          terraform init -backend=false
          terraform validate

      - name: Terraform Validate (Production)
        run: |
          cd terraform/environments/production
          terraform init -backend=false
          terraform validate

  ############################################################################
  # Stage 2: IaC Security Scanning
  ############################################################################
  iac-security:
    name: "🛡️ IaC Security Scan"
    runs-on: ubuntu-latest
    needs: format-validate
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # tfsec - Terraform Security Scanner
      - name: Run tfsec
        uses: aquasecurity/tfsec-action@v1.0.3
        with:
          working_directory: terraform/
          format: sarif
          soft_fail: true

      - name: Upload tfsec SARIF
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: results.sarif
          category: tfsec

      # Checkov - Policy-as-Code Scanner
      - name: Run Checkov
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: terraform/
          framework: terraform
          output_format: cli,sarif
          output_file_path: console,checkov-results.sarif
          soft_fail: true
          skip_check: CKV_AWS_144,CKV_AWS_145 # Skip cross-region replication checks

      - name: Upload Checkov SARIF
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: checkov-results.sarif
          category: checkov

  ############################################################################
  # Stage 3: Terraform Plan (PRs only — review before merge)
  ############################################################################
  plan:
    name: "📋 Terraform Plan"
    runs-on: ubuntu-latest
    needs: iac-security
    if: github.event_name == 'pull_request'
    strategy:
      matrix:
        environment: [dev, staging]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform Init
        run: |
          cd terraform/environments/${{ matrix.environment }}
          terraform init

      - name: Terraform Plan
        id: plan
        run: |
          cd terraform/environments/${{ matrix.environment }}
          terraform plan -no-color -input=false 2>&1 | tee plan-output.txt
        continue-on-error: true

      - name: Comment Plan on PR
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync('terraform/environments/${{ matrix.environment }}/plan-output.txt', 'utf8');
            const truncated = plan.length > 60000 ? plan.substring(0, 60000) + '\n... (truncated)' : plan;

            const body = `### Terraform Plan - \`${{ matrix.environment }}\`

            <details>
            <summary>Show Plan Output</summary>

            \`\`\`hcl
            ${truncated}
            \`\`\`

            </details>

            **Plan Status:** ${{ steps.plan.outcome == 'success' && '✅ Success' || '❌ Failed' }}`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });

  ############################################################################
  # Stage 4: Terraform Apply (push to main only — deploys dev environment)
  ############################################################################
  apply:
    name: "🚀 Terraform Apply (Dev)"
    runs-on: ubuntu-latest
    needs: iac-security
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    outputs:
      cluster_name: ${{ steps.outputs.outputs.cluster_name }}
      cluster_endpoint: ${{ steps.outputs.outputs.cluster_endpoint }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform Init
        run: |
          cd terraform/environments/${{ env.ENVIRONMENT }}
          terraform init

      - name: Terraform Plan
        run: |
          cd terraform/environments/${{ env.ENVIRONMENT }}
          terraform plan -out=tfplan -input=false

      - name: Terraform Apply
        run: |
          cd terraform/environments/${{ env.ENVIRONMENT }}
          terraform apply -auto-approve -input=false tfplan

      - name: Export Terraform Outputs
        id: outputs
        run: |
          cd terraform/environments/${{ env.ENVIRONMENT }}
          echo "cluster_name=$(terraform output -raw eks_cluster_name)" >> $GITHUB_OUTPUT
          echo "cluster_endpoint=$(terraform output -raw eks_cluster_endpoint)" >> $GITHUB_OUTPUT

  ############################################################################
  # Stage 5: Bootstrap ArgoCD & Kubernetes Resources
  # Runs after Terraform creates the EKS cluster and installs Helm charts
  ############################################################################
  bootstrap:
    name: "🔧 Bootstrap ArgoCD & Gateway API"
    runs-on: ubuntu-latest
    needs: apply
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Configure kubectl
        run: |
          aws eks update-kubeconfig \
            --name ${{ needs.apply.outputs.cluster_name }} \
            --region ${{ env.AWS_REGION }}

      - name: Wait for EKS nodes to be Ready
        run: |
          echo "⏳ Waiting for EKS nodes to be Ready..."
          for i in $(seq 1 30); do
            READY_NODES=$(kubectl get nodes --no-headers 2>/dev/null | grep -c " Ready" || true)
            if [ "$READY_NODES" -ge 1 ]; then
              echo "✅ $READY_NODES node(s) are Ready"
              kubectl get nodes
              break
            fi
            echo "  Attempt $i/30: $READY_NODES nodes ready, waiting 20s..."
            sleep 20
          done

          if [ "$READY_NODES" -lt 1 ]; then
            echo "❌ No nodes became Ready within timeout"
            exit 1
          fi

      - name: Wait for ArgoCD to be Ready
        run: |
          echo "⏳ Waiting for ArgoCD server pods..."
          kubectl wait --for=condition=Ready pod \
            -l app.kubernetes.io/name=argocd-server \
            -n argocd \
            --timeout=300s || {
            echo "⚠️ ArgoCD pods not ready yet, checking status..."
            kubectl get pods -n argocd
          }

      - name: Apply Kubernetes base manifests (Namespaces & Gateway API)
        run: |
          echo "📦 Applying Kubernetes base manifests..."
          kubectl apply -f kubernetes/base/

      - name: Apply ArgoCD Project
        run: |
          echo "📋 Applying ArgoCD project..."
          kubectl apply -f argocd/projects/ecommerce.yaml

      - name: Apply ArgoCD App-of-Apps (triggers full deployment)
        run: |
          echo "🚀 Applying ArgoCD App-of-Apps..."
          kubectl apply -f argocd/app-of-apps.yaml

      - name: Verify deployment status
        run: |
          echo ""
          echo "════════════════════════════════════════════════════════"
          echo "  ✅  Infrastructure & Application Deployment Complete"
          echo "════════════════════════════════════════════════════════"
          echo ""
          echo "📦 Cluster: ${{ needs.apply.outputs.cluster_name }}"
          echo "🌐 Endpoint: ${{ needs.apply.outputs.cluster_endpoint }}"
          echo ""
          echo "--- Namespaces ---"
          kubectl get namespaces
          echo ""
          echo "--- ArgoCD Applications ---"
          kubectl get applications -n argocd 2>/dev/null || echo "ArgoCD applications syncing..."
          echo ""
          echo "--- All Pods (platform) ---"
          kubectl get pods -n argocd --no-headers 2>/dev/null | head -10
          kubectl get pods -n monitoring --no-headers 2>/dev/null | head -10
          echo ""
          echo "--- Helm Releases ---"
          kubectl get pods -A --no-headers 2>/dev/null | wc -l | xargs -I{} echo "{} total pods running"
