################################################################################
# Reusable DevSecOps CI Workflow Template for Microservices
# Pipeline: Lint & Test → SAST & SCA → Build & Scan → Push & Sign → Deploy
################################################################################

name: CI - Shared Template

on:
  workflow_call:
    inputs:
      service_name:
        required: true
        type: string
      python_version:
        required: false
        type: string
        default: "3.12"
    secrets:
      AWS_ROLE_ARN:
        required: true
      AWS_REGION:
        required: true

permissions:
  id-token: write        # OIDC token for AWS + cosign keyless signing
  contents: read
  security-events: write # Upload SARIF results to Security tab
  attestations: write    # Image attestation / provenance

env:
  SERVICE_PATH: services/${{ inputs.service_name }}
  ECR_REPOSITORY: ecommerce/${{ inputs.service_name }}

jobs:
  ############################################################################
  # Stage 1: Lint & Test
  ############################################################################
  lint-and-test:
    name: "🧪 Lint & Test"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python_version }}
          cache: pip
          cache-dependency-path: ${{ env.SERVICE_PATH }}/requirements.txt

      - name: Install dependencies
        run: |
          pip install -r ${{ env.SERVICE_PATH }}/requirements.txt
          pip install ruff pytest pytest-asyncio pytest-cov

      - name: Lint with Ruff
        run: ruff check ${{ env.SERVICE_PATH }}/src/

      - name: Run unit tests
        run: |
          cd ${{ env.SERVICE_PATH }}
          pytest tests/ -v --cov=src --cov-report=xml --cov-report=term-missing || true

  ############################################################################
  # Stage 2: SAST & SCA (Security Analysis)
  ############################################################################
  security-scan:
    name: "🔒 SAST & SCA"
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python_version }}

      - name: Install security tools
        run: pip install bandit pip-audit

      # SAST - Static Application Security Testing
      - name: Run Bandit (SAST)
        run: |
          bandit -r ${{ env.SERVICE_PATH }}/src/ \
            -f sarif \
            -o bandit-results.sarif \
            --severity-level medium \
            || true

      - name: Upload Bandit SARIF results
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: bandit-results.sarif
          category: bandit-${{ inputs.service_name }}

      # SCA - Software Composition Analysis
      - name: Run pip-audit (SCA)
        run: |
          pip-audit \
            -r ${{ env.SERVICE_PATH }}/requirements.txt \
            --desc \
            --fix \
            --output pip-audit-results.json \
            --format json \
            || true

      - name: Check for critical vulnerabilities
        run: |
          if [ -f pip-audit-results.json ]; then
            CRITICAL=$(python3 -c "
          import json, sys
          try:
              data = json.load(open('pip-audit-results.json'))
              vulns = data.get('dependencies', [])
              critical = [v for dep in vulns for v in dep.get('vulns', []) if 'CRITICAL' in v.get('fix_versions', [''])]
              print(len(critical))
          except:
              print(0)
          ")
            if [ "$CRITICAL" -gt 0 ]; then
              echo "::error::Found $CRITICAL critical vulnerabilities in dependencies"
              exit 1
            fi
          fi

  ############################################################################
  # Stage 3: Build, Container Scan & Push
  ############################################################################
  build-scan-push:
    name: "🐳 Build, Scan & Push"
    runs-on: ubuntu-latest
    needs: security-scan
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    outputs:
      image_tag: ${{ steps.meta.outputs.version }}
      image_uri: ${{ steps.meta.outputs.image_uri }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Generate image metadata
        id: meta
        run: |
          SHORT_SHA=$(echo ${{ github.sha }} | cut -c1-8)
          IMAGE_URI="${{ steps.ecr-login.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${SHORT_SHA}"
          echo "version=${SHORT_SHA}" >> $GITHUB_OUTPUT
          echo "image_uri=${IMAGE_URI}" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: ${{ env.SERVICE_PATH }}
          file: ${{ env.SERVICE_PATH }}/Dockerfile
          push: false
          load: true
          tags: |
            ${{ steps.ecr-login.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ steps.meta.outputs.version }}
            ${{ steps.ecr-login.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Container Security Scanning
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "${{ steps.ecr-login.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ steps.meta.outputs.version }}"
          format: "sarif"
          output: "trivy-results.sarif"
          severity: "CRITICAL,HIGH"
          exit-code: "1"
          ignore-unfixed: true

      - name: Upload Trivy scan results
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: "trivy-results.sarif"
          category: trivy-${{ inputs.service_name }}

      # Push to ECR (only if scan passes)
      - name: Push to ECR
        run: |
          docker push ${{ steps.ecr-login.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ steps.meta.outputs.version }}
          docker push ${{ steps.ecr-login.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest

      # Image Signing with cosign (keyless via OIDC)
      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign container image
        env:
          IMAGE: ${{ steps.ecr-login.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ steps.meta.outputs.version }}
        run: |
          cosign sign --yes "${IMAGE}"

  ############################################################################
  # Stage 3b: Build & Scan Only (PRs - no push)
  ############################################################################
  build-scan-pr:
    name: "🔍 Build & Scan (PR)"
    runs-on: ubuntu-latest
    needs: security-scan
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image (PR validation)
        uses: docker/build-push-action@v6
        with:
          context: ${{ env.SERVICE_PATH }}
          file: ${{ env.SERVICE_PATH }}/Dockerfile
          push: false
          load: true
          tags: ${{ env.ECR_REPOSITORY }}:pr-${{ github.event.number }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run Trivy vulnerability scanner (PR)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "${{ env.ECR_REPOSITORY }}:pr-${{ github.event.number }}"
          format: "table"
          severity: "CRITICAL,HIGH"
          exit-code: "1"
          ignore-unfixed: true

  ############################################################################
  # Stage 4: Update Helm Values (triggers ArgoCD sync)
  ############################################################################
  update-helm-values:
    name: "🚀 Update Helm Values"
    runs-on: ubuntu-latest
    needs: build-scan-push
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update image tag in Helm values
        run: |
          NEW_TAG="${{ needs.build-scan-push.outputs.image_tag }}"
          VALUES_FILE="${{ env.SERVICE_PATH }}/helm/values.yaml"

          # Update the image tag
          sed -i "s/tag: .*/tag: \"${NEW_TAG}\"/" "${VALUES_FILE}"

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add ${{ env.SERVICE_PATH }}/helm/values.yaml
          git diff --staged --quiet || git commit -m "ci(${{ inputs.service_name }}): update image tag to ${{ needs.build-scan-push.outputs.image_tag }}"
          git push
